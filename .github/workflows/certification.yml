---
name: Run collection certification checks

permissions:
  contents: read

'on':
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: cert-ver-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  call:
    uses: ansible-collections/partner-certification-checker/.github/workflows/certification-reusable.yml@v1.2.0
    with:
      python-versions: '["3.9", "3.10", "3.11", "3.12"]'
