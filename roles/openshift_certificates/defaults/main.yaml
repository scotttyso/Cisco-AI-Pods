---
certificate_wait_minutes: 2
certificate_prompt_before_apply: false
openshift_api_url: "{{ lookup('ansible.builtin.env', 'openshift_api_url') }}"
openshift_token: "{{ lookup('ansible.builtin.env', 'openshift_token_id') }}"
validate_certificates: "{{ lookup('ansible.builtin.env', 'validate_certificates') | default('false') | bool }}"
