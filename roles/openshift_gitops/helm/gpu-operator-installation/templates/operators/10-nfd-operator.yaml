#  This file is used to create the Namespace, OperatorGroup, and Subscription for the Node Feature Discovery (NFD) Operator.
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-nfd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-nfd-group
  namespace: openshift-nfd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  targetNamespaces:
    - openshift-nfd
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: nfd
  namespace: openshift-nfd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  channel: "stable"
  installPlanApproval: {{ .Values.installPlanApproval | default "Manual" }}
  name: nfd
  source: redhat-operators
  sourceNamespace: openshift-marketplace
