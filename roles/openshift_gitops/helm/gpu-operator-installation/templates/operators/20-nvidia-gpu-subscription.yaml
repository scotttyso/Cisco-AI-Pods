---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: gpu-operator-certified
  namespace: nvidia-gpu-operator
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  channel: {{ .Values.nvidiaGpuChannel }}
  installPlanApproval: {{ .Values.installPlanApproval | default "Manual" }}
  {{- if .Values.nvidiaGpuVersion }}
  startingCSV: {{ .Values.nvidiaGpuVersion }}
  {{- end }}
  name: gpu-operator-certified
  source: certified-operators
  sourceNamespace: openshift-marketplace
