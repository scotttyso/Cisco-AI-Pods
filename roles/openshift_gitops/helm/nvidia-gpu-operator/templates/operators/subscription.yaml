---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: gpu-operator-certified
  namespace: nvidia-gpu-operator
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  channel: {{ .Values.nvidiaGpuVersion | default('gpu-operator-certified.v26.3.3') | regexFind "v[0-9]+\\.[0-9]+" }}
  installPlanApproval: {{ .Values.installPlanApproval | default "Manual" }}
  name: gpu-operator-certified
  startingCSV: {{ .Values.nvidiaGpuVersion }}
  source: certified-operators
  sourceNamespace: openshift-marketplace
