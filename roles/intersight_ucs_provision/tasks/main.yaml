---
- name: Set Intersight Variable Folder Fact
  ansible.builtin.set_fact:
    intersight_directory: "{{ playbook_dir.rstrip('/') | dirname }}/host_vars/intersight"

- name: Set Intersight UCS Log File Path
  ansible.builtin.set_fact:
    intersight_log_file: "/tmp/deploy_intersight_ucs.log"

- name: Start Intersight UCS Provisioning Python Module Asynchronously
  ansible.builtin.shell: >
    python3 -u {{ role_path }}/library/deploy_intersight_ucs.py
    -d {{ intersight_directory }}
    > {{ intersight_log_file }} 2>&1
  args:
    executable: /bin/bash
  environment:
    PYTHONUNBUFFERED: "1"
  async: 3600
  poll: 0
  register: intersight_async_job
  changed_when: false

- name: Wait for Intersight UCS Provisioning to Complete
  ansible.builtin.async_status:
    jid: "{{ intersight_async_job.ansible_job_id }}"
  register: validation_result
  until: validation_result.finished
  retries: 540
  delay: 5
  failed_when: false
  changed_when: false

- name: Print Intersight UCS Provisioning Log
  ansible.builtin.command:
    argv:
      - cat
      - "{{ intersight_log_file }}"
  register: _log_output
  changed_when: false
  failed_when: false

- name: Display Intersight UCS Provisioning Log
  ansible.builtin.debug:
    msg: "{{ _log_output.stdout_lines }}"

- name: Cleanup Intersight UCS Provisioning Log
  ansible.builtin.file:
    path: "{{ intersight_log_file }}"
    state: absent

- name: Fail If Intersight UCS Provisioning Python Module Failed
  ansible.builtin.fail:
    msg: >-
      Intersight UCS provisioning failed (rc={{ validation_result.rc | default('unknown') }}).
  when: validation_result.rc | default(0) | int != 0
