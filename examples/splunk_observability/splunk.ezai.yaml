---
splunk_observability:
  access_token: 1
  intersight:
    enable: true
  nexus:
    device_list:
      - 198.18.0.1
      - 198.18.0.2
      - 198.18.0.3
    features:
      bgp: false
      environment: false
      facts: false
      interfaces: true
      optics: true
    password: 1
    username: admin
  openshift_cluster:
    cluster_name: my-cluster
    environment: my-environment
  otel_collector:
    metrics_collection:
      etcd_metrics: true
      nvidia_gpu_metrics: true
      portworx_metrics: true
      trident_metrics: false
    everpure_flash_arrays:
      - api_token_id: 1
        namespace: purefa
        endpoint: my-everpure-array.example.com
    proxy:
      http_proxy: http://my-proxy.example.com:8080
      https_proxy: http://my-proxy.example.com:8080
      no_proxy:
       - localhost
       - 10.0.0.0/8
       - 172.132.0.0/15
       - .svc.cluster.local
       - .cluster.local
       - apps.cluster-name.example.com
       - .cluster-name.example.com
       - .example.com
  realm: us0
  splunk_platform:
    endpoint: https://customer.splunkcloud.com
    index: my_index
    token: 1
